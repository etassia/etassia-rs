# Release pipeline for the etassia crates (parsanol-rs approach)
#
# On every push to main, release-plz computes the next version from
# conventional commits, opens the release PR (merging it is the release
# decision), and publishes the touched publishable crates to crates.io.
#
# Publishing authenticates through crates.io Trusted Publishing (RFC 3691):
# the workflow's OIDC token is exchanged for a 30-minute registry token by
# rust-lang/crates-io-auth-action, matched against the registration in the
# etassia crate's crates.io settings (repository etassia/etassia-rs, workflow
# release-plz.yml, no environment). There is no CARGO_REGISTRY_TOKEN secret.
#
# Secret required (repository settings):
#   ETASSIA_CI_PAT_TOKEN  — PAT with repo scope; PRs created with GITHUB_TOKEN
#                           do not trigger CI on themselves
#
# The etassia-ffi and etassia-wasm crates are publish = false: the cdylib
# ships through the rubygems cross-gems (release-bindings.yml) and the wasm
# package through npm, matching parsanol-rs's parsanol-ffi handling.

name: Release-plz

permissions:
  pull-requests: write
  contents: write
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize runs: two overlapping release-plz invocations raced on the
# pre-merge snapshot and opened a duplicate release PR (parsanol-rs #227).
concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Exchange the OIDC token for a crates.io publish token
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.ETASSIA_CI_PAT_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
